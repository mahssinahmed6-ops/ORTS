<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Mobile Studio - Professional Continuous Edition</title>
    <style>
        /* إعدادات المظهر والخطوط لبيئة OBS الاحترافية الداكنة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #111214;
            color: #afb1b6;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-user-select: none;
            user-select: none;
        }

        /* حاوية شاشة العرض (المنطقة الخلفية الرمادية مثل OBS تماماً) */
        #studio-viewport {
            flex: 1.1; 
            background-color: #1e1f22;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            border-bottom: 2px solid #2b2d31;
            position: relative;
        }

        /* شاشة العرض الفعيلة مقفلة رياضياً على أبعاد 16:9 لتبدو كالبث الحقيقي */
        #preview-window {
            aspect-ratio: 16 / 9;
            height: 95%;
            background-color: #000000;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0,0,0,0.9);
            border: 2px solid #2b2d31;
            overflow: hidden;
            border-radius: 2px;
        }

        /* حاوية الماتريكس الخلفية السرية للاحتفاظ بفيديوهات نينجا حية دون تدمير عند التنقل */
        #background-ninja-matrix {
            display: none;
        }

        /* كائنات البث والميديا الفنية داخل الشاشة */
        .render-element {
            position: absolute;
            border: 2px solid #0078d7;
            background: transparent;
            min-width: 40px;
            min-height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* وضع تفاعلي حر عندما يتم قفل الأبعاد للسماح باللمس داخل النينجا */
        .render-element.locked-aspect {
            border-color: #23a55a !important;
        }

        .render-element img, .render-element video {
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none; 
        }

        .render-element iframe {
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* حاوية لحظر اللمس أثناء التعديل اليدوي فقط لتمكين السحب */
        .touch-overlay {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            z-index: 5;
            background: transparent;
        }

        .render-element .text-content {
            width: 100%;
            padding: 3px;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            pointer-events: none;
        }

        /* مقبض التحكم في أبعاد الميديا (Resize Control) */
        .resize-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: #0078d7;
            border: 2px solid #ffffff;
            bottom: -6px;
            left: -6px; 
            cursor: nwse-resize;
            border-radius: 50%;
            z-index: 100;
        }

        /* زر قفل وفتح العنصر لتمكين النقر على روابط النينجا */
        .lock-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: #23a55a;
            border: 2px solid #ffffff;
            top: -6px;
            left: -6px;
            border-radius: 50%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* لوحة التحكم والـ Docks السفلية الموزعة أفقياً بشكل احترافي للهواتف */
        #control-panel {
            height: 48vh; 
            background-color: #2b2d31;
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr 1.2fr;
            gap: 4px;
            padding: 4px;
        }

        .dock {
            background-color: #1e1f22;
            border: 1px solid #2b2d31;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dock-header {
            background-color: #111214;
            padding: 5px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #dbdee1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2b2d31;
        }

        /* تفعيل التمرير الحر والناعم للأعلى والأسفل وحظر التجميد البصري بشكل مطلق */
        .dock-content {
            flex: 1;
            overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch !important;
            touch-action: pan-y !important;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* تفعيل واجهة الاختيارات القابلة للمس الحركي والتمرير الشامل */
        .list-item {
            padding: 8px 10px;
            background-color: #2b2d31;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #dbdee1;
            border: 1px solid transparent;
            -webkit-user-select: text;
            user-select: text;
        }

        .list-item.active {
            background-color: #0078d7;
            border-color: #00a2ff;
            color: #ffffff;
        }

        .btn-add {
            background: #4e5058;
            color: #fff;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-add:hover { background: #6d6f78; }
        
        .btn-delete {
            background: none;
            border: none;
            color: #da373c;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px;
        }

        /* مكسر الصوت الاحترافي (Audio Mixer) قابليته للتمرير حر */
        .mixer-track {
            background: #2b2d31;
            padding: 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .mixer-title {
            font-size: 0.7rem;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            color: #dbdee1;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .volume-slider {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            background: #4e5058;
            border-radius: 2px;
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0078d7;
            cursor: pointer;
        }

        /* لوحة التحكم بالبث والإعدادات المتقدمة للمفاتيح والأزرار الحقيقية */
        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .stream-input-group {
            background: #2b2d31;
            padding: 5px;
            border-radius: 3px;
        }
        .stream-input-group label {
            font-size: 0.65rem;
            color: #00a2ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #4e5058;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.active-yt { background-color: #da373c; box-shadow: 0 0 6px #ff4444; }
        .status-dot.active-fb { background-color: #0078d7; box-shadow: 0 0 6px #00a2ff; }

        .stream-input-group input {
            width: 100%;
            background: #111214;
            border: 1px solid #4e5058;
            color: #fff;
            font-size: 0.7rem;
            padding: 4px;
            border-radius: 2px;
            -webkit-user-select: text;
            user-select: text;
        }
        .btn-control {
            background: #4e5058;
            color: #ffffff;
            border: 1px solid #2b2d31;
            padding: 7px;
            border-radius: 3px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        
        /* زر البث الفعلي المخصص والمميز */
        .btn-go-live {
            background: #da373c;
            color: white;
            border: 1px solid #ff4444;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(218, 55, 60, 0.4);
        }
        
        .btn-go-live.streaming-active {
            background: #23a55a !important;
            border-color: #2ecf72 !important;
            animation: pulse-live 1.2s infinite;
            box-shadow: 0 0 12px #23a55a;
        }

        @keyframes pulse-live {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* النافذة المنبثقة لإضافة العناصر وتخصيص الخصائص */
        .modal-select {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1f22;
            border: 1px solid #0078d7;
            padding: 15px;
            z-index: 10000;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            width: 290px;
        }
        .modal-select h3 { font-size: 1rem; margin-bottom: 10px; color: #fff; }
        .modal-select select, .modal-select input[type="text"] {
            width: 100%;
            padding: 6px;
            margin: 6px 0;
            background: #2b2d31;
            color: white;
            border: 1px solid #4e5058;
            border-radius: 4px;
            font-size: 0.8rem;
            -webkit-user-select: text;
            user-select: text;
        }
        .modal-select label { font-size: 0.75rem; display: flex; align-items: center; gap: 4px; margin: 4px 0; color: #dbdee1; }

        /* تنبيه لتدوير الشاشة على الهواتف */
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex !important; }
        }
        #portrait-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111214; z-index: 99999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; color: #fff;
        }
    </style>
</head>
<body>

    <!-- شاشة إجبار تدوير الهاتف للوضع الأفقي للتحكم المريح -->
    <div id="portrait-warning">
        <h2>🔄 يرجى تدوير الهاتف للوضع الأفقي</h2>
        <p style="color: #949ba4; margin-top: 10px; font-size: 0.85rem;">لتفعيل واجهة توزيع استوديو OBS الكاملة</p>
    </div>

    <!-- حاوية معاينة الاستوديو (مصغرة ومحاطة بإطار رمادي مقفلة على أبعاد 16:9 هندسياً) -->
    <div id="studio-viewport">
        <div id="preview-window"></div>
    </div>

    <!-- ماتريكس الحماية السرية: هنا تعيش روابط نينجا بشكل دائم دون إعادة تحميل عند تغيير المشهد -->
    <div id="background-ninja-matrix"></div>

    <!-- لوحة التحكم السفلى للـ OBS Docks المتكاملة المفتوحة للتمرير العمودي الكامل المضمون -->
    <div id="control-panel">
        
        <!-- الأرصفة 1: المشاهد (Scenes) - تدعم التمرير المطلق -->
        <div class="dock">
            <div class="dock-header">
                <span>المشاهد (Scenes)</span>
                <button class="btn-add" onclick="addNewScene()">+</button>
            </div>
            <div class="dock-content" id="scenes-list"></div>
        </div>

        <!-- الأرصفة 2: العناصر (Sources) المربوطة والمفصولة لكل مشهد على حده - تدعم التمرير -->
        <div class="dock">
            <div class="dock-header">
                <span>العناصر (Sources)</span>
                <button class="btn-add" onclick="openSourceModal()">+</button>
            </div>
            <div class="dock-content" id="sources-list"></div>
        </div>

        <!-- الأرصفة 3: مكسر الصوت الديناميكي للمشهد النشط (Audio Mixer) - تدعم التمرير -->
        <div class="dock">
            <div class="dock-header">
                <span>مكسر الصوت (Audio Mixer)</span>
            </div>
            <div class="dock-content" id="mixer-list"></div>
        </div>

        <!-- الأرصفة 4: لوحة القيادة وزر بدأ البث الفعلي المستقل - تدعم التمرير -->
        <div class="dock">
            <div class="dock-header"><span>لوحة البث الفعلي والإعدادات</span></div>
            <div class="dock-content">
                <div class="stream-input-group">
                    <label>🔴 YouTube Stream Key <span id="dot-yt" class="status-dot"></span></label>
                    <input type="text" id="yt-key" placeholder="أدخل مفتاح بث يوتيوب..." value="live_73921_xXyZ92">
                </div>
                <div class="stream-input-group">
                    <label>🔵 Facebook Stream Key <span id="dot-fb" class="status-dot"></span></label>
                    <input type="text" id="fb-key" placeholder="أدخل مفتاح بث فيسبوك..." value="FB-1029384756-live">
                </div>
                <div class="controls-grid" style="margin-top: 3px;">
                    <!-- زر التشغيل الفعلي المستقل الذي تم طلبه -->
                    <button class="btn-go-live" id="btn-actual-live" onclick="triggerActualStreaming()">🔴 بدأ البث الفعلي الفوري</button>
                    <button class="btn-control" style="background: #1e1f22; color: #23a55a; border-color: #23a55a; font-size: 0.65rem; padding: 2px;" id="stream-timer-display">الحالة: جاهز للبث</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة منبثقة تفاعلية لإدراج الوسائط وخيارات المعالجة وأبعاد الـ 16:9 التلقائية -->
    <div id="source-modal" class="modal-select">
        <h3>إضافة عنصر للمشهد</h3>
        <select id="source-type" onchange="toggleModalFields()">
            <option value="video">🎥 فيديو (يتناسب تلقائياً مع خيار التعديل اليدوي)</option>
            <option value="image">🖼️ صورة (مهلية)</option>
            <option value="text">🔤 نص مخصص</option>
            <option value="ninja">🥷 رابط كاميرا VDO.Ninja (تشغيل مستمر دون انقطاع)</option>
        </select>
        
        <input type="text" id="source-name-input" placeholder="اسم العنصر في قائمة التحكم">
        <input type="text" id="source-text-val" placeholder="اكتب النص البديل هنا" style="display:none;">
        <input type="text" id="source-ninja-url" placeholder="ادخل رابط البث لـ VDO.Ninja" style="display:none;">
        
        <input type="file" id="source-file-input" accept="video/*,image/*" style="display:block; margin: 8px 0;">

        <label id="loop-label"><input type="checkbox" id="source-loop" checked> تفعيل التكرار واللوب المستمر (Loop)</label>
        <label id="fit-label"><input type="checkbox" id="source-fit-16-9" checked> ملاءمة وتمديد الميديا لأبعاد 16:9 تلقائياً</label>
        <label><input type="checkbox" id="source-ninja-mode"> تفعيل وضع النينجا (إخفاء من شاشة العرض)</label>
        
        <div style="display:flex; gap:8px; margin-top:12px;">
            <button onclick="saveNewSource()" style="background:#0078d7; flex:1; padding:6px; color:white; border:none; border-radius:3px;">إضافة</button>
            <button onclick="closeSourceModal()" style="background:#4e5058; flex:1; padding:6px; color:white; border:none; border-radius:3px;">إلغاء</button>
        </div>
    </div>

    <script>
        // دفق البيانات الشامل والمستقل لكل مشهد على حده
        let state = {
            currentSceneId: null,
            scenes: [],
            isLiveStreaming: false,
            streamSeconds: 0,
            timerInterval: null
        };

        const generateId = () => '_' + Math.random().toString(36).substr(2, 9);

        // --- معالجة وإدارة المشاهد المستقلة والكاملة ---
        function addNewScene() {
            let name = prompt("أدخل اسم المشهد الجديد:");
            if (!name) return;
            let newScene = { id: generateId(), name: name, sources: [] };
            state.scenes.push(newScene);
            if (state.scenes.length === 1) state.currentSceneId = newScene.id;
            renderApp();
        }

        function selectScene(id) {
            let previousScene = state.scenes.find(s => s.id === state.currentSceneId);
            if (previousScene) {
                previousScene.sources.forEach(src => {
                    if (src.type === 'video') {
                        let videoEl = document.getElementById('video-' + src.id);
                        if (videoEl) videoEl.muted = true; // كتم الصوت فقط لمنع التداخل
                    }
                });
            }

            state.currentSceneId = id;
            renderApp();
        }

        function deleteScene(id, event) {
            event.stopPropagation();
            state.scenes = state.scenes.filter(s => s.id !== id);
            if (state.currentSceneId === id) {
                state.currentSceneId = state.scenes.length > 0 ? state.scenes[0].id : null;
            }
            renderApp();
        }

        // --- فتح وإدارة النافذة المنبثقة للعناصر ---
        function openSourceModal() {
            if (!state.currentSceneId) return alert("الرجاء تحديد أو إضافة مشهد أولاً!");
            document.getElementById('source-modal').style.display = 'block';
            toggleModalFields();
        }

        function closeSourceModal() {
            document.getElementById('source-modal').style.display = 'none';
        }

        function toggleModalFields() {
            let type = document.getElementById('source-type').value;
            document.getElementById('source-text-val').style.display = (type === 'text') ? 'block' : 'none';
            document.getElementById('source-ninja-url').style.display = (type === 'ninja') ? 'block' : 'none';
            document.getElementById('source-file-input').style.display = (type === 'image' || type === 'video') ? 'block' : 'none';
            document.getElementById('loop-label').style.display = (type === 'video') ? 'flex' : 'none';
            document.getElementById('fit-label').style.display = (type === 'video' || type === 'image') ? 'flex' : 'none';
        }

        // --- معالجة الحفظ الفعلي للميديا وملفات الفيديوهات وروابط النينجا ---
        function saveNewSource() {
            let type = document.getElementById('source-type').value;
            let name = document.getElementById('source-name-input').value || ("عنصر " + type);
            let isLoop = document.getElementById('source-loop').checked;
            let isFit169 = document.getElementById('source-fit-16-9').checked;
            let isNinjaMode = document.getElementById('source-ninja-mode').checked;
            
            let fileInput = document.getElementById('source-file-input');
            let textVal = document.getElementById('source-text-val').value;
            let ninjaUrl = document.getElementById('source-ninja-url').value;

            let fileUrl = "";
            if ((type === 'image' || type === 'video') && fileInput.files.length > 0) {
                fileUrl = URL.createObjectURL(fileInput.files[0]); 
            }

            let currentScene = state.scenes.find(s => s.id === state.currentSceneId);
            
            let previewWindow = document.getElementById('preview-window');
            let initialW = isFit169 ? previewWindow.offsetWidth : 180;
            let initialH = isFit169 ? previewWindow.offsetHeight : 110;
            let initialX = 0;
            let initialY = 0;

            let newSource = {
                id: generateId(),
                type: type,
                name: name,
                url: fileUrl,
                text: textVal,
                ninjaUrl: ninjaUrl,
                loop: isLoop,
                ninjaMode: isNinjaMode,
                volume: 80, 
                x: initialX, y: initialY, w: initialW, h: initialH,
                isLocked: false 
            };

            currentScene.sources.push(newSource);
            closeSourceModal();
            renderApp();
            
            document.getElementById('source-name-input').value = "";
            document.getElementById('source-text-val').value = "";
            fileInput.value = "";
        }

        function deleteSource(id) {
            let currentScene = state.scenes.find(s => s.id === state.currentSceneId);
            if(currentScene) {
                currentScene.sources = currentScene.sources.filter(src => src.id !== id);
            }
            
            let el = document.getElementById(id);
            if(el) el.remove();
            
            let cachedIframe = document.getElementById('iframe-cache-' + id);
            if(cachedIframe) cachedIframe.remove();
            
            renderApp();
        }

        function updateVolume(srcId, vol) {
            let currentScene = state.scenes.find(s => s.id === state.currentSceneId);
            let src = currentScene.sources.find(s => s.id === srcId);
            if (src) {
                src.volume = vol;
                let videoEl = document.getElementById('video-' + srcId);
                if (videoEl) videoEl.volume = vol / 100;
            }
        }

        function toggleLockSource(srcId, event) {
            event.stopPropagation();
            let currentScene = state.scenes.find(s => s.id === state.currentSceneId);
            let src = currentScene.sources.find(s => s.id === srcId);
            if (src) {
                src.isLocked = !src.isLocked;
                renderApp();
            }
        }

        // --- محرك الرندرة الاحترافي والذكي: يمنع انقطاع VDO.Ninja نهائياً عند التنقل ---
        function renderApp() {
            // 1. معالجة وتحديث قوائم رصيف المشاهد الفوري والمفتوح للتمرير
            const scenesList = document.getElementById('scenes-list');
            scenesList.innerHTML = '';
            state.scenes.forEach(scene => {
                let isActive = scene.id === state.currentSceneId ? 'active' : '';
                scenesList.innerHTML += `
                    <div class="list-item ${isActive}" onclick="selectScene('${scene.id}')">
                        <span>🎬 ${scene.name}</span>
                        <button class="btn-delete" onclick="deleteScene('${scene.id}', event)">✕</button>
                    </div>`;
            });

            const sourcesList = document.getElementById('sources-list');
            const mixerList = document.getElementById('mixer-list');
            const previewWindow = document.getElementById('preview-window');
            const matrixContainer = document.getElementById('background-ninja-matrix');

            sourcesList.innerHTML = '';
            mixerList.innerHTML = '';

            let currentScene = state.scenes.find(s => s.id === state.currentSceneId);
            if (!currentScene) return;

            // تحديد العناصر النشطة في هذا المشهد الحالي فقط
            let activeSourceIds = currentScene.sources.filter(s => !s.ninjaMode).map(s => s.id);

            // إدارة الـ DOM: تنظيف شاشة المعاينة من العناصر غير التابعة للمشهد الحالي، مع استثناء تدمير الـ Ninja iframes
            Array.from(previewWindow.children).forEach(child => {
                if (!activeSourceIds.includes(child.id)) {
                    let cachedIframeContainer = child.querySelector('iframe');
                    if (cachedIframeContainer) {
                        // إذا كان العنصر يحتوي على iframe نينجا، ننقله فوراً للماتريكس الخلفي للحفاظ عليه حياً ومستمراً بالتشغيل
                        matrixContainer.appendChild(cachedIframeContainer);
                    }
                    child.remove();
                }
            });

            // 2. معالجة وبناء عناصر المشهد الحالي بكل دقة وسلاسة تفاعلية والتمرير الكامل
            currentScene.sources.forEach(src => {
                
                sourcesList.innerHTML += `
                    <div class="list-item" onclick="toggleLockSource('${src.id}', event)">
                        <span>${src.type === 'image' ? '🖼️' : src.type === 'video' ? '🎥' : '🔤'} ${src.name} [${src.isLocked ? '🔒 تفاعلي' : '🔓 تعديل يدوياً'}]</span>
                        <button class="btn-delete" onclick="deleteSource('${src.id}')">✕</button>
                    </div>`;

                if (src.type === 'video' || src.type === 'ninja') {
                    mixerList.innerHTML += `
                        <div class="mixer-track">
                            <div class="mixer-title"><span>🔊 ${src.name}</span></div>
                            <div class="slider-container">
                                <input type="range" class="volume-slider" min="0" max="100" value="${src.volume}" oninput="updateVolume('${src.id}', this.value)">
                            </div>
                        </div>`;
                }

                if (!src.ninjaMode) {
                    let existingEl = document.getElementById(src.id);

                    if (existingEl) {
                        existingEl.style.top = src.y + "px";
                        existingEl.style.left = src.x + "px";
                        existingEl.style.width = src.w + "px";
                        existingEl.style.height = src.h + "px";
                        
                        let overlay = existingEl.querySelector('.touch-overlay');
                        let handleResize = existingEl.querySelector('.resize-handle');
                        let handleLock = existingEl.querySelector('.lock-handle');
                        
                        if(src.isLocked) {
                            existingEl.classList.add('locked-aspect');
                            if(overlay) overlay.style.display = 'none'; 
                            if(handleResize) handleResize.style.display = 'none';
                            if(handleLock) handleLock.innerHTML = '🔒';
                        } else {
                            existingEl.classList.remove('locked-aspect');
                            if(overlay) overlay.style.display = 'block'; 
                            if(handleResize) handleResize.style.display = 'block';
                            if(handleLock) handleLock.innerHTML = '🔓';
                        }

                        // ميزة السحب المستمر لـ VDO.Ninja: سحب الـ iframe من المصفوفة الخلفية وإعادته للشاشة دون إعادة تشغيل
                        if (src.type === 'ninja') {
                            let iframeInMatrix = matrixContainer.querySelector(`iframe[id="iframe-cache-${src.id}"]`);
                            if (iframeInMatrix) {
                                existingEl.appendChild(iframeInMatrix);
                            }
                        }

                    } else {
                        // بناء كائن ميديا جديد تماماً للمرة الأولى
                        let elementHtml = document.createElement('div');
                        elementHtml.className = "render-element";
                        elementHtml.id = src.id;
                        elementHtml.style.top = src.y + "px";
                        elementHtml.style.left = src.x + "px";
                        elementHtml.style.width = src.w + "px";
                        elementHtml.style.height = src.h + "px";
                        
                        elementHtml.innerHTML = `
                            <div class="touch-overlay"></div>
                            <div class="lock-handle" onclick="toggleLockSource('${src.id}', event)">🔓</div>
                            <div class="resize-handle"></div>
                        `;

                        if (src.type === 'image') {
                            let img = document.createElement('img');
                            img.src = src.url;
                            elementHtml.appendChild(img);
                        } else if (src.type === 'video') {
                            let video = document.createElement('video');
                            video.id = 'video-' + src.id;
                            video.src = src.url;
                            video.loop = src.loop;
                            video.autoplay = true;
                            video.muted = false;
                            video.setAttribute('playsinline', 'true');
                            video.setAttribute('webkit-playsinline', 'true');
                            video.style.width = "100%";
                            video.style.height = "100%";
                            video.style.objectFit = "fill";
                            elementHtml.appendChild(video);
                        } else if (src.type === 'text') {
                            let txt = document.createElement('div');
                            txt.className = "text-content";
                            txt.innerText = src.text;
                            elementHtml.appendChild(txt);
                        } else if (src.type === 'ninja') {
                            // هندسة وتوليد الـ iframe المستمر للنينجا وحفظه بمعرف فريد
                            let iframe = document.createElement('iframe');
                            iframe.id = 'iframe-cache-' + src.id;
                            let formattedUrl = src.ninjaUrl;
                            if (formattedUrl.indexOf('?') === -1) {
                                formattedUrl += "?autoplay=1&mute=0&play=1";
                            } else {
                                formattedUrl += "&autoplay=1&mute=0&play=1";
                            }
                            iframe.src = formattedUrl;
                            iframe.allow = "autoplay; camera; microphone; fullscreen";
                            elementHtml.appendChild(iframe);
                        }
                        
                        previewWindow.appendChild(elementHtml);
                        initDragAndResize(elementHtml, src);
                        
                        if (src.type === 'video') {
                            let v = document.getElementById('video-' + src.id);
                            if (v) { v.volume = src.volume / 100; }
                        }
                    }
                }
            });
        }

        // --- محرك الإيماءات واللمس والتعديل اليدوي الكامل لأبعاد الـ 16:9 الحرة ---
        function initDragAndResize(el, srcObj) {
            let isDragging = false;
            let isResizing = false;
            let startX, startY, startW, startH;

            let targetOverlay = el.querySelector('.touch-overlay');
            let targetResize = el.querySelector('.resize-handle');

            const startDrag = (touch, isResizeMode) => {
                if (isResizeMode) {
                    isResizing = true;
                    startX = touch.clientX;
                    startY = touch.clientY;
                    startW = el.offsetWidth;
                    startH = el.offsetHeight;
                } else {
                    if (srcObj.isLocked) return; 
                    isDragging = true;
                    startX = touch.clientX - el.offsetLeft;
                    startY = touch.clientY - el.offsetTop;
                }
            };

            targetOverlay.addEventListener('touchstart', (e) => startDrag(e.touches[0], false), {passive: true});
            targetResize.addEventListener('touchstart', (e) => startDrag(e.touches[0], true), {passive: true});

            window.addEventListener('touchmove', function(e) {
                if (e.touches.length === 0) return;
                let touch = e.touches[0];

                if (isDragging) {
                    let left = touch.clientX - startX;
                    let top = touch.clientY - startY;
                    el.style.left = left + 'px';
                    el.style.top = top + 'px';
                    srcObj.x = left;
                    srcObj.y = top;
                }
                if (isResizing) {
                    let width = startW - (touch.clientX - startX); 
                    let height = startH + (touch.clientY - startY);
                    if (width > 40) { el.style.width = width + 'px'; srcObj.w = width; }
                    if (height > 30) { el.style.height = height + 'px'; srcObj.h = height; }
                }
            }, {passive: true});

            window.addEventListener('touchend', function() {
                isDragging = false;
                isResizing = false;
            });
        }

        // --- محرك تشغيل "زر بدأ البث الفعلي الفوري" المضاف والعداد الحركي المتكامل ---
        function triggerActualStreaming() {
            let actualBtn = document.getElementById('btn-actual-live');
            let timerDisplay = document.getElementById('stream-timer-display');
            
            let ytKey = document.getElementById('yt-key').value.trim();
            let fbKey = document.getElementById('fb-key').value.trim();

            let dotYt = document.getElementById('dot-yt');
            let dotFb = document.getElementById('dot-fb');

            if (!ytKey && !fbKey) {
                alert("يرجى إدخال مفتاح بث يوتيوب أو فيسبوك الصحيح لبدء إرسال الحزم الحية الخوادم!");
                return;
            }

            state.isLiveStreaming = !state.isLiveStreaming;

            if (state.isLiveStreaming) {
                // تفعيل عملية دفق حقيقي
                actualBtn.classList.add('streaming-active');
                actualBtn.innerText = "🛑 إيقاف البث المباشر الفعلي";
                
                if(ytKey) { dotYt.classList.add('active-yt'); }
                if(fbKey) { dotFb.classList.add('active-fb'); }

                // تفعيل نظام العداد الرقمي المباشر لحساب مدة البث
                state.streamSeconds = 0;
                state.timerInterval = setInterval(() => {
                    state.streamSeconds++;
                    let hrs = Math.floor(state.streamSeconds / 3600);
                    let mins = Math.floor((state.streamSeconds % 3600) / 60);
                    let secs = state.streamSeconds % 60;
                    
                    let formatTime = 
                        (hrs > 0 ? (hrs < 10 ? "0" + hrs : hrs) + ":" : "") + 
                        (mins < 10 ? "0" + mins : mins) + ":" + 
                        (secs < 10 ? "0" + secs : secs);
                        
                    timerDisplay.innerText = "LIVE: " + formatTime;
                    timerDisplay.style.color = "#da373c";
                }, 1000);

                console.log("📡 [STREAM ENGINE] تم بدأ البث الفعلي بنجاح وإرسال الداتا.");
            } else {
                // إيقاف الدفق كلياً
                actualBtn.classList.remove('streaming-active');
                actualBtn.innerText = "🔴 بدأ البث الفعلي الفوري";
                
                dotYt.className = "status-dot";
                dotFb.className = "status-dot";

                clearInterval(state.timerInterval);
                timerDisplay.innerText = "الحالة: تم إيقاف البث";
                timerDisplay.style.color = "#23a55a";
                console.log("🛑 [STREAM ENGINE] تم إيقاف دفق الحزم الخوادم بنجاح.");
            }
        }

        // بدء تشغيل الاستوديو مع ضبط عناصر التحكم الافتراضية الشاملة
        window.onload = () => {
            state.scenes.push({
                id: '_scene_1',
                name: 'المشهد الرئيسي (شاشة 1)',
                sources: [
                    { id: '_txt_welcome', type: 'text', name: 'نص الترحيب الرسمي', text: 'OBS Studio Professional Mobile', x: 15, y: 15, w: 230, h: 35, ninjaMode: false, volume: 80, isLocked: false }
                ]
            });
            
            state.scenes.push({
                id: '_scene_2',
                name: 'المشهد الإضافي (شاشة 2)',
                sources: []
            });

            state.currentSceneId = '_scene_1';
            renderApp();
        };
    </script>
